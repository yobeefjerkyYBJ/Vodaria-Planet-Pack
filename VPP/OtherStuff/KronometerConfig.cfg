		symbol = Aze
		days = 25
		}

		Month
		{
		name = Ruluary
		symbol = Rul
		days = 25
		}

		Month
		{
		name = Nosember
		symbol = Nos
		days = 25
		}

		Month
		{
		name = Mezary
		symbol = Mez
		days = 25
		}

		Month
		{
		name = Perenuary
		symbol = Per
		days = 25
		}

		Month
		{
		name = Terune
		symbol = Ter
		days = 25
		}

		Month
		{
