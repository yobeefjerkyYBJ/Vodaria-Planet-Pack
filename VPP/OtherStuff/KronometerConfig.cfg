@Kronometer:FINAL
{
	%useHomeDay = True
	%useHomeYear = True
	%useLeapYears = True
	%resetMonthNumAfterMonths = 12
	%resetMonthsAfterYears = 1
	!DisplayDate,* {}
	!Months, * {}
	
	DisplayDate
	{
		PrintDate
		{
			offsetTime = 0
			offsetDay = 1
			offsetYear = 1
			displayDate = <Mo1> <Dm>, <Y>
			displayTime = < - <H><H0><M><M0>
			displaySeconds = , <S><S0>
		}
		PrintDateNew
		{
			offsetTime = 0
			offsetDay = 1
			offsetYear = 1
			displayDate = <Mo1> <Dm>, <Y>
			displayTime = < - <H:D2>:<M:D2>
			displaySeconds = :<S:D2>
		}
		PrintDateCompact
		{
			offsetTime = 0
			offsetDay = 1
			offsetYear = 1
			displayDate = <Mo1> <Dm>, <Y>
			displayTime = , <H>:<M:00>
			displaySeconds = :<S:00>
		}
	}	

	Months
	{
		Month
		{
		name = Osember
		symbol = Ose
		days = 25
		}

		Month
		{
		name = Tyrin
		symbol = Tyr
		days = 25
		}

		Month
		{
		name = Vokuzene
		symbol = Vok
		days = 25
		}

		Month
		{
